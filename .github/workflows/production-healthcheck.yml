name: Production HTTP Healthcheck

on:
  push:
    branches:
      - 'feature/hotfix-direct-deploy-20260911'

jobs:
  check:
    name: Check production HTTP
    runs-on: ubuntu-latest
    steps:
      - name: Testar endpoints públicos
        shell: bash
        run: |
          set +e
          echo '=== release-version ==='
          curl -vkLsS --connect-timeout 5 --max-time 15 https://tickets.sutoorii.com/release-version.txt -o /tmp/release.txt
          release_exit=$?
          echo "release_exit=$release_exit"
          test -f /tmp/release.txt && cat /tmp/release.txt || true
          echo
          echo '=== up ==='
          curl -vkLsS --connect-timeout 5 --max-time 15 https://tickets.sutoorii.com/up -o /tmp/up.txt
          up_exit=$?
          echo "up_exit=$up_exit"
          test -f /tmp/up.txt && head -c 500 /tmp/up.txt || true
          echo
          echo '=== root ==='
          curl -vkLsS --connect-timeout 5 --max-time 15 https://tickets.sutoorii.com/ -o /tmp/root.txt
          root_exit=$?
          echo "root_exit=$root_exit"
          test -f /tmp/root.txt && head -c 500 /tmp/root.txt || true
          echo
          if [ "$release_exit" -ne 0 ] || [ "$up_exit" -ne 0 ] || [ "$root_exit" -ne 0 ]; then
            exit 1
          fi
