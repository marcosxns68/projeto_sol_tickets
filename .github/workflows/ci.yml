name: CI Sutoorii Tickets

on:
  push:
    branches:
      - feature/finalizacao-sutoorii-tickets
  workflow_dispatch:

concurrency:
  group: sutoorii-tickets-feature-ci
  cancel-in-progress: true

jobs:
  test:
    name: Testes PHP
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, imap
          coverage: none

      - name: Preparar diretórios
        run: |
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          chmod -R 775 storage bootstrap/cache

      - name: Instalar dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Executar testes
        run: php artisan test
