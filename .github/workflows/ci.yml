name: CI Sutoorii Tickets

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: sutoorii-tickets-feature-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes PHP
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, imap
          coverage: none

      - name: Preparar diretórios
        run: |
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          chmod -R 775 storage bootstrap/cache

      - name: Instalar dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Executar testes
        run: php artisan test

      - name: Validar rotas e estratégia de deploy
        run: |
          php artisan route:list >/dev/null
          php -l app/Support/DeploymentMigration.php
          php -l public/deployment-bootstrap.php
          php -l public/index.php
          if grep -Eq 'curl .*deploy\.php|public/deploy\.php' .github/workflows/deploy.yml; then
            echo 'O deploy ainda depende do endpoint HTTP bloqueado pela hospedagem.'
            exit 1
          fi
          grep -q 'storage/app/private/' .github/workflows/deploy.yml
          grep -q 'deployment-bootstrap.php' .github/workflows/deploy.yml
          grep -q 'storage/framework/deploy-migrate' .github/workflows/deploy.yml
