name: CI Sutoorii Tickets

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: sutoorii-tickets-feature-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes PHP
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, imap
          coverage: none

      - name: Preparar diretórios
        run: |
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          chmod -R 775 storage bootstrap/cache

      - name: Instalar dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Executar testes
        run: php artisan test

      - name: Validar rotas e estratégia de deploy
        run: |
          php artisan route:list >/dev/null
          php -l public/index.php
          if grep -q 'DeploymentBootstrap::apply' public/index.php; then
            echo 'O index ainda tenta extrair pacote durante a requisição.'
            exit 1
          fi
          if grep -q 'DeploymentMigration::run' public/index.php; then
            echo 'O index ainda tenta executar migrations durante a requisição.'
            exit 1
          fi
          if grep -q 'deploy-release.zip' .github/workflows/deploy.yml; then
            echo 'O deploy ainda depende do pacote ZIP aplicado por uma requisição web.'
            exit 1
          fi
          grep -q '.deploy/direct/' .github/workflows/deploy.yml
          grep -q 'Verificar produção' .github/workflows/deploy.yml
