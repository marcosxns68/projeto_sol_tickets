name: Login Session Diagnostic

on:
  push:
    branches:
      - feature/hotfix-direct-deploy-20260911
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Reproduzir persistência de sessão e CSRF em produção
        shell: bash
        run: |
          set -euo pipefail
          base='https://tickets.sutoorii.com'

          curl -kLsS -c /tmp/cookies.txt -D /tmp/get1-headers.txt "$base/entrar" -o /tmp/login1.html
          token1=$(sed -n 's/.*name="_token" value="\([^"]*\)".*/\1/p' /tmp/login1.html | head -n1)
          test -n "$token1"

          curl -kLsS -b /tmp/cookies.txt -c /tmp/cookies.txt -D /tmp/get2-headers.txt "$base/entrar" -o /tmp/login2.html
          token2=$(sed -n 's/.*name="_token" value="\([^"]*\)".*/\1/p' /tmp/login2.html | head -n1)
          test -n "$token2"

          echo "token1_hash=$(printf '%s' "$token1" | sha256sum | awk '{print $1}')"
          echo "token2_hash=$(printf '%s' "$token2" | sha256sum | awk '{print $1}')"
          if [ "$token1" = "$token2" ]; then
            echo 'same_token_across_gets=yes'
          else
            echo 'same_token_across_gets=no'
          fi

          echo 'cookie_names:'
          awk 'NF>=7 {print $6}' /tmp/cookies.txt | sort -u

          echo 'set_cookie_names_get1:'
          grep -i '^set-cookie:' /tmp/get1-headers.txt | sed -E 's/^set-cookie: ([^=]+)=.*/\1/I' || true
          echo 'set_cookie_names_get2:'
          grep -i '^set-cookie:' /tmp/get2-headers.txt | sed -E 's/^set-cookie: ([^=]+)=.*/\1/I' || true

          status=$(curl -kLsS -b /tmp/cookies.txt -c /tmp/cookies-after-post.txt \
            -D /tmp/post-headers.txt -o /tmp/post-body.html \
            -w '%{http_code}' \
            -X POST "$base/entrar" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -H "Referer: $base/entrar" \
            --data-urlencode "_token=$token2" \
            --data-urlencode 'email=diagnostic@example.invalid' \
            --data-urlencode 'password=senha-invalida')

          echo "post_status=$status"
          grep -Ei '^(HTTP/|location:)' /tmp/post-headers.txt || true
          echo 'post_set_cookie_names:'
          grep -i '^set-cookie:' /tmp/post-headers.txt | sed -E 's/^set-cookie: ([^=]+)=.*/\1/I' || true
          echo 'body_title:'
          grep -io '<title>[^<]*</title>' /tmp/post-body.html | head -n1 || true
