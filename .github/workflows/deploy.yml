name: Deploy Sutoorii Tickets

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sutoorii-tickets-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build e deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar recuperação imediata do index
        run: |
          mkdir -p .deploy/recovery-public
          cp public/index.php .deploy/recovery-public/index.php

      - name: Desbloquear requisições PHP primeiro
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./.deploy/recovery-public/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}public/
          dangerous-clean-slate: false

      - name: Diagnóstico após desbloqueio do index
        shell: bash
        run: |
          set +e
          curl -fkLsS --connect-timeout 5 --max-time 10 https://tickets.sutoorii.com/up -o /tmp/early-up.txt
          code=$?
          echo "health após index: curl exit=${code}"
          test -f /tmp/early-up.txt && head -c 500 /tmp/early-up.txt || true
          echo
          exit 0

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, bcmath, gd, zip, imap
          coverage: none

      - name: Preparar diretórios
        run: |
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          chmod -R 775 storage bootstrap/cache

      - name: Instalar dependências de produção
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Montar versão para envio direto
        run: |
          printf '%s\n' "${GITHUB_SHA}" > public/release-version.txt
          mkdir -p .deploy/direct
          rsync -a app bootstrap config database public resources routes vendor artisan composer.json .deploy/direct/

      - name: Publicar versão diretamente no servidor
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./.deploy/direct/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false

      - name: Verificar produção
        shell: bash
        run: |
          echo '=== DNS ==='
          getent ahosts tickets.sutoorii.com
          echo '=== versão publicada ==='
          curl -fkLsS --connect-timeout 10 --max-time 30 https://tickets.sutoorii.com/release-version.txt
          echo
          echo '=== health ==='
          curl -fkLsS --connect-timeout 10 --max-time 30 https://tickets.sutoorii.com/up
          echo
          echo '=== página inicial ==='
          curl -fkLsS --connect-timeout 10 --max-time 30 https://tickets.sutoorii.com/ -o /tmp/root.html
          test -s /tmp/root.html
          head -c 500 /tmp/root.html
          echo
