name: Deploy Sutoorii Tickets

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sutoorii-tickets-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build e deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, bcmath, gd, zip, imap
          coverage: none

      - name: Preparar diretórios
        run: |
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          chmod -R 775 storage bootstrap/cache

      - name: Instalar dependências de produção
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Montar pacote da nova versão
        run: |
          printf '%s\n' "${GITHUB_SHA}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" > storage/framework/deploy-migrate
          printf '%s\n' "${GITHUB_SHA}" > public/release-version.txt
          mkdir -p .deploy/archive .deploy/bootstrap
          zip -qr .deploy/archive/deploy-release.zip . \
            -x '.git/*' '.github/*' '.deploy/*' '.env' '.env.*' 'node_modules/*' 'tests/*' 'docs/*' 'README.md' 'DEPLOY.md' \
               'storage/logs/*' 'storage/framework/cache/*' 'storage/framework/sessions/*' 'storage/framework/views/*' \
               'storage/app/private/*' 'storage/app/public/*'
          cp public/index.php public/deployment-bootstrap.php .deploy/bootstrap/

      - name: Enviar pacote para área privada
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./.deploy/archive/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}storage/app/private/
          dangerous-clean-slate: false

      - name: Ativar nova versão pelo bootstrap local
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./.deploy/bootstrap/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}public/
          dangerous-clean-slate: false
