name: Deploy Sutoorii Tickets

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sutoorii-tickets-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build e deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar recuperação imediata do index
        run: |
          mkdir -p .deploy/recovery-public
          cp public/index.php .deploy/recovery-public/index.php

      - name: Desbloquear requisições PHP primeiro
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./.deploy/recovery-public/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}public/
          dangerous-clean-slate: false

      - name: Diagnóstico após desbloqueio do index
        shell: bash
        run: |
          set +e
          curl -fkLsS --connect-timeout 5 --max-time 10 https://tickets.sutoorii.com/up -o /tmp/early-up.txt
          code=$?
          echo "health após index: curl exit=${code}"
          test -f /tmp/early-up.txt && head -c 500 /tmp/early-up.txt || true
          echo
          exit 0

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, bcmath, gd, zip, imap
          coverage: none

      - name: Preparar diretórios
        run: |
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          chmod -R 775 storage bootstrap/cache

      - name: Instalar dependências de produção
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Montar versão para envio direto
        shell: bash
        run: |
          printf '%s\n' "${GITHUB_SHA}" > public/release-version.txt
          mkdir -p .deploy/direct
          rsync -a app bootstrap config database public resources routes vendor artisan composer.json .deploy/direct/

          DEPLOY_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${DEPLOY_TOKEN}"
          echo "DEPLOY_TOKEN=${DEPLOY_TOKEN}" >> "${GITHUB_ENV}"
          DEPLOY_TOKEN_HASH="$(printf '%s' "${DEPLOY_TOKEN}" | sha256sum | awk '{print $1}')"

          cat > .deploy/direct/public/deploy-migrate.php <<'PHP'
          <?php

          declare(strict_types=1);

          header('Content-Type: text/plain; charset=UTF-8');

          $provided = (string) ($_SERVER['HTTP_X_DEPLOY_TOKEN'] ?? '');
          $expectedHash = '__DEPLOY_TOKEN_HASH__';

          if ($provided === '' || !hash_equals($expectedHash, hash('sha256', $provided))) {
              http_response_code(404);
              echo 'not-found';
              exit;
          }

          register_shutdown_function(static function (): void {
              @unlink(__FILE__);
          });

          require __DIR__.'/../vendor/autoload.php';

          $app = require_once __DIR__.'/../bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
          $kernel->bootstrap();

          $exitCode = $kernel->call('migrate', ['--force' => true]);
          if ($exitCode !== 0) {
              http_response_code(500);
              echo 'migration-failed';
              exit;
          }

          echo 'migration-ok';
          PHP

          sed -i "s/__DEPLOY_TOKEN_HASH__/${DEPLOY_TOKEN_HASH}/" .deploy/direct/public/deploy-migrate.php

      - name: Publicar versão diretamente no servidor
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./.deploy/direct/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false

      - name: Executar migrations no servidor
        shell: bash
        run: |
          migration_code="$(curl -kLsS --connect-timeout 10 --max-time 120 \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            -o /tmp/deploy-migration.txt \
            -w '%{http_code}' \
            https://tickets.sutoorii.com/deploy-migrate.php)"

          cat /tmp/deploy-migration.txt
          echo
          test "${migration_code}" = "200"
          grep -qx 'migration-ok' /tmp/deploy-migration.txt

          cleanup_code="$(curl -kLsS --connect-timeout 10 --max-time 30 \
            -o /dev/null \
            -w '%{http_code}' \
            https://tickets.sutoorii.com/deploy-migrate.php)"
          test "${cleanup_code}" = "404"

      - name: Verificar produção
        shell: bash
        run: |
          echo '=== DNS ==='
          getent ahosts tickets.sutoorii.com
          echo '=== versão publicada ==='
          curl -fkLsS --connect-timeout 10 --max-time 30 https://tickets.sutoorii.com/release-version.txt
          echo
          echo '=== health ==='
          curl -fkLsS --connect-timeout 10 --max-time 30 https://tickets.sutoorii.com/up
          echo
          echo '=== página inicial ==='
          curl -fkLsS --connect-timeout 10 --max-time 30 https://tickets.sutoorii.com/ -o /tmp/root.html
          test -s /tmp/root.html
          head -c 500 /tmp/root.html
          echo
