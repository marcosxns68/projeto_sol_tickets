name: Deploy Sutoorii Tickets

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sutoorii-tickets-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build e deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, bcmath, gd, zip, imap
          coverage: none

      - name: Instalar dependências de produção
        run: |
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          chmod -R 775 storage bootstrap/cache
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Preparar diretórios do Laravel
        run: |
          mkdir -p storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          chmod -R 775 storage bootstrap/cache

      - name: Compactar versão de produção
        run: |
          mkdir -p .deploy
          zip -qr .deploy/release.zip . \
            -x '.git/*' '.github/*' '.deploy/*' '.env' '.env.*' 'node_modules/*' 'tests/*' 'README.md' 'DEPLOY.md'
          DEPLOY_TOKEN="$(openssl rand -hex 32)"
          DEPLOY_HASH="$(printf '%s' "$DEPLOY_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$DEPLOY_TOKEN"
          echo "DEPLOY_TOKEN=$DEPLOY_TOKEN" >> "$GITHUB_ENV"
          sed "s/__DEPLOY_HASH__/$DEPLOY_HASH/" deploy/extract.php > .deploy/deploy.php

      - name: Enviar para hospedagem
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./.deploy/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}public/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**

      - name: Extrair versão no servidor
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            --data-urlencode "token=$DEPLOY_TOKEN" \
            https://tickets.sutoorii.com/public/deploy.php
